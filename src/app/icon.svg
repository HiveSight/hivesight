<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Honeycomb hexagon background -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>
  <!-- Inner hexagon -->
  <polygon points="16,6 24,11 24,21 16,26 8,21 8,11" fill="#FCD34D"/>
  <!-- Eye circle -->
  <circle cx="16" cy="16" r="6" fill="white" stroke="#92400E" stroke-width="1"/>
  <!-- Pupil -->
  <circle cx="16" cy="16" r="3" fill="#1F2937"/>
  <!-- Eye highlight -->
  <circle cx="14.5" cy="14.5" r="1" fill="white"/>
</svg>
