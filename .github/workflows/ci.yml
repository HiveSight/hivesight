name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  reproduce-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Regenerate analysis artifacts from committed inputs
        run: |
          PINS="numpy==2.3.4,scipy==1.16.3,matplotlib==3.10.7"
          uv run --with "$PINS" python analysis/analyze_anchor.py
          uv run --with "$PINS" python analysis/analyze_anchor_v2.py
          uv run --with "$PINS" python analysis/analyze_model_refresh.py
          uv run --with "$PINS" python analysis/make_paper_assets.py

      # Numeric comparison: Linux and macOS round the last float bits
      # differently, so a byte diff fails on noise (red since July 2026).
      - name: Verify artifacts unchanged
        run: python3 analysis/compare_artifacts.py
