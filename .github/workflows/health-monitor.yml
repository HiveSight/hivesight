name: Health monitor

# Reads /api/health from outside Vercel and keeps one open issue per problem.
# This job fails only when the monitor itself breaks, never for an outage.
# On Max's Mac, ~/chief-of-staff/bin/hivesight-health-watch starts this workflow
# about every 15 minutes, sends each new issue to Max, and alerts him when the
# monitor stops.

on:
  schedule:
    # We keep this schedule as a backup to the watcher. In the 33 hours after
    # this workflow landed on November 2, 2026, GitHub started four scheduled
    # runs, and others report missing or sparse scheduled runs too:
    # https://github.com/orgs/community/discussions/206019
    # We picked minutes 8, 23, 38 and 53 to stay off the hour, where GitHub
    # warns that runs face delays.
    - cron: "8/15 * * * *"
  workflow_dispatch:
    inputs:
      drill:
        description: Test the alert path against scripts/health-drill.json
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  issues: write

# Two runs at once could both find no issue and both open one.
concurrency:
  group: health-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check hivesight.ai
        run: node scripts/health-monitor.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_DRILL: ${{ inputs.drill }}

      # GitHub disables schedules on a public repo after 60 days with no activity.
      - name: Keep this schedule enabled
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/health-monitor.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
